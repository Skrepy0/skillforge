[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
dynamic = ["version"]
description = "垂直领域 AI 技能包的编排与治理运行时"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Skrepy0", email = "155234406+Skrepy0@users.noreply.github.com" },
    { name = "ikunabc", email = "122463590+ikunabc@users.noreply.github.com" },
]
keywords = ["agent-skills", "orchestration", "llm", "document-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "python-pptx>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.30",
    "pydantic>=2.0",
]

[project.scripts]
skillforge = "skillforge.l4_interface.cli:main"

[project.urls]
Repository = "https://github.com/Skrepy0/skillforge"

[tool.setuptools.dynamic]
version = { attr = "skillforge.shared.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["skillforge*"]

[dependency-groups]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "mypy>=1.10",
    "poethepoet>=0.49.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.poe.tasks]
test = "pytest -q"
lint = "ruff check ."
format = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "mypy skillforge"
validate = "skillforge validate"
# 提交前一条命令跑完所有检查
check = ["lint", "fmt-check", "typecheck", "validate", "test"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["skillforge", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=skillforge", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["skillforge"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
